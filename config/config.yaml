data:
  dataset_path: "./data/chest_xray"
  image_size: 224
  batch_size: 32
  num_workers: 4
  valid_pct: 0.2
  seed: 42

training:
  architectures:
    - resnet34
    - resnet50
    - densenet121
  default_arch: resnet34
  epochs_freeze: 3
  epochs_unfreeze: 5
  weight_decay: 0.01
  seed: 42

evaluation:
  confidence_threshold: 0.75
  test_path: "./data/chest_xray/test"

gradcam:
  alpha: 0.4  # overlay transparency

wandb:
  project: "xray-pneumonia-classifier"
  enabled: false  # set to true when W&B is configured

outputs:
  models_dir: "./outputs/models"
  figures_dir: "./outputs/figures"
  metrics_dir: "./outputs/metrics"
